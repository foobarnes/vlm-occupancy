name: Bug report
description: Report a reproducible integration problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Before posting, remove API keys, credentials, camera snapshots, camera
        URLs, public IP addresses, entity identifiers, and unredacted
        diagnostics. Report security issues through the private link instead.
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide minimal steps with all sensitive values redacted.
    validations:
      required: true
